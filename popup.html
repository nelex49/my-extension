<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>YT Folder Extension</title>
    <style>
      body {
        font-family: sans-serif;
        width: 250px;
        padding: 10px;
      }
      button {
        padding: 8px;
        background: #cc0000;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: 8px;
        width: 100%;
      }
      button:hover {
        background: #ff0000;
      }
      #logout {
        display: none;
      }
      #status {
        font-size: 13px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h2>YT Folder Extension</h2>
    <button id="login">Sign in with Google</button>
    <button id="logout">Logout</button>
    <pre id="status">Not logged in.</pre>
    <script src="popup.js"></script>
  </body>
</html>
